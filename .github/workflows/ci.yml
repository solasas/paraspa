name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real PostgreSQL for the "application starts, Flyway migrates, Hibernate validates" test.
    # (The Testcontainers tests start their own throw-away PostgreSQL through the runner's Docker.)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: paraspa_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paraspa_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # read by application.properties; JWT_SECRET for tests comes from src/test/resources/config
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: paraspa_ci
      DB_USER: postgres
      DB_PASSWORD: ci-only-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
