# Test defaults. "config/application.properties" is read in ADDITION to src/main/resources/application.properties
# and wins over it, so tests get a signing key without any environment variable.
jwt.secret=test-only-signing-key-for-the-automated-tests-never-use-it-anywhere-else-0123456789
# The suites register dozens of users from one address; the limiter has its own tests that switch it on.
rate-limit.enabled=false
spring.jpa.show-sql=false
