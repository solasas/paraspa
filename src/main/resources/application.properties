spring.application.name=paraspa

# Local development convenience: values in a ".env" file in the working directory (KEY=value lines, no quotes) are
# read as configuration. The file is optional and git-ignored; real environment variables win over it.
spring.config.import=optional:file:.env[.properties]

# Server Configuration
server.port=${PORT:8080}
# Behind a reverse proxy set FORWARD_HEADERS_STRATEGY=native so the rate limiter sees the real client IP
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Database Configuration. DB_PASSWORD has no default on purpose: the app refuses to start without it.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paraspa_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration. JWT_SECRET has no default on purpose (at least 64 characters: openssl rand -base64 64).
jwt.secret=${JWT_SECRET}
# Access token lifetime: 15 minutes. The refresh token (rotated on every use) lives 30 days.
jwt.expiration=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Browser origins allowed to call the API (comma separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

# Rate limiting (token buckets, see RateLimitProperties). Set RATE_LIMIT_ENABLED=false to switch it off.
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:10}
rate-limit.login.period=${RATE_LIMIT_LOGIN_PERIOD:1m}
rate-limit.register.capacity=${RATE_LIMIT_REGISTER_CAPACITY:10}
rate-limit.register.period=${RATE_LIMIT_REGISTER_PERIOD:1h}
rate-limit.refresh.capacity=${RATE_LIMIT_REFRESH_CAPACITY:30}
rate-limit.refresh.period=${RATE_LIMIT_REFRESH_PERIOD:1m}
rate-limit.message.capacity=${RATE_LIMIT_MESSAGE_CAPACITY:30}
rate-limit.message.period=${RATE_LIMIT_MESSAGE_PERIOD:1m}

# Logging
logging.level.root=INFO
logging.level.com.sashank.paraspa=${LOG_LEVEL:INFO}

# Actuator: only health (and info) over HTTP; details are never shown to anonymous callers.
# /actuator/health/liveness and /readiness are the probes for Kubernetes-style platforms.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# API docs: Swagger UI at /swagger-ui.html, the OpenAPI document at /v3/api-docs. SWAGGER_ENABLED=false hides both.
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.tags-sorter=alpha

# Flyway: existing databases (created by Hibernate before Flyway) are baselined at version 1
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# File uploads: 2 MB per file (avatars, post images); a post carries up to 4 images
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=10MB

# File storage: "local" writes under storage.local.root and serves them at /files/**
storage.type=local
storage.local.root=${STORAGE_ROOT:uploads}
