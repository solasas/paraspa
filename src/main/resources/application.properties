spring.application.name=paraspa

# Server Configuration
server.port=${PORT:8080}

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:paraspa_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is owned by Flyway (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-use-a-long-secure-string-at-least-256-bits
jwt.expiration=86400000

# Logging
logging.level.root=INFO
logging.level.com.sashank.paraspa=DEBUG

# Flyway: existing databases (created by Hibernate before Flyway) are baselined at version 1
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# File uploads (avatars): 2 MB per file
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# File storage: "local" writes under storage.local.root and serves them at /files/**
storage.type=local
storage.local.root=${STORAGE_ROOT:uploads}
